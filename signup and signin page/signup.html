<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Clearance Signup</title>
  <link rel="stylesheet" href="/signup and signin page/singup.css">
</head>
<body>
  <div class="container">
    <h2>Signup</h2>
    <form id="signupForm">
      <label for="fullName">Full Name:</label>
      <input type="text" id="fullName" placeholder="Enter your full name">

      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="Enter your email">

      <label for="password">Password:</label>
      <input type="password" id="password" placeholder="Enter password">

      <label for="confirmPassword">Confirm Password:</label>
      <input type="password" id="confirmPassword" placeholder="Confirm password">

      <button type="submit">Sign Up</button>

      <!-- ✅ Added Sign In link below button -->
      <p class="signin-link">
        Already have an account?
        <a href="/signup and signin page/signin.html">Sign in</a>
      </p>
    </form>
  </div>

  <script src="/signup and signin page/singup.js"></script>
</body>
</html>
