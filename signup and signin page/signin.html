<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Clearance Signin</title>
  <link rel="stylesheet" href="/signup and signin page/signin.css">
</head>
<body>
  <div class="container">
    <h2>Sign In</h2>
    <form id="signinForm">
      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="Enter your email">

      <label for="password">Password:</label>
      <input type="password" id="password" placeholder="Enter your password">

      <button type="submit">Sign In</button>

      <!-- ✅ Link back to signup -->
      <p class="signup-link">
        Don’t have an account?
        <a href="/signup and signin page/signup.html">Sign up</a>
      </p>
    </form>
  </div>

  <script src="/signup and signin page/signin.js"></script>
</body>
</html>
